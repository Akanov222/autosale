              - column:
                  name: price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: load_capacity
                  type: NUMERIC(10,2)
        - addForeignKeyConstraint:
            baseTableName: truck
            baseColumnNames: car_type_id
            constraintName: fk_truck_car_type
            referencedTableName: car_type
            referencedColumnNames: id

        - insert:
            tableName: truck
            columns:
              - column:
                  name: id
                  value: 1
              - column:
                  name: brand
                  value: "Chevrolet"
              - column:
                  name: model
                  value: "Blazer"
              - column:
                  name: year
                  value: 2010
              - column:
                  name: car_type_id
                  value: 2
              - column:
                  name: price
                  value: 35000.0
              - column:
                  name: load_capacity
                  value: 456.0

