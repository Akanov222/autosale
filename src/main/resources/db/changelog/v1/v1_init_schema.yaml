databaseChangeLog:
  - changeSet:
      id: 1
      author: your_name
      changes:
        - preConditions:
            - onFail: MARK_RAN
            - not:
                - tableExists:
                    tableName: car_type
        - createTable:
            tableName: car_type
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - insert:
            tableName: car_type
            columns:
              - column:
                  name: id
                  value: 1
              - column:
                  name: name
                  value: "SEDAN"
        - insert:
            tableName: car_type
            columns:
              - column:
                  name: id
                  value: 2
              - column:
                  name: name
                  value: "TRUCK"
        - insert:
            tableName: car_type
            columns:
              - column:
                  name: id
                  value: 3
              - column:
                  name: name
                  value: "MINIVAN"

  - changeSet:
      id: 2
      author: your_name
      changes:
        - preConditions:
            - onFail: MARK_RAN
            - not:
                - tableExists:
                    tableName: sedan
        - createTable:
            tableName: sedan
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: brand
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: model
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: year
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: car_type_id
                  type: bigint
              - column:
                  name: price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: trunk_capacity
                  type: NUMERIC(10,2)
        - addForeignKeyConstraint:
            baseTableName: sedan
            baseColumnNames: car_type_id
            constraintName: fk_sedan_car_type
            referencedTableName: car_type
            referencedColumnNames: id

        - insert:
            tableName: sedan
            columns:
              - column:
                  name: id
                  value: 1
              - column:
                  name: brand
                  value: "Chevrolet"
              - column:
                  name: model
                  value: "Colorado"
              - column:
                  name: year
                  value: 2010
              - column:
                  name: car_type_id
                  value: 1
              - column:
                  name: price
                  value: 25000.0
              - column:
                  name: trunk_capacity
                  value: 456.0

  - changeSet:
      id: 3
      author: your_name
      changes:
        - preConditions:
